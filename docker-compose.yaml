services:
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - "./app:/var/www/html"
      - "./data/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./data/logs/nginx:/var/log/nginx"
    depends_on:
      - php
    restart: always

  php:
    image: ghcr.io/uneg-cit/php-fpm:${PHP_VERSION:-8.2}
    extra_hosts:
      - "db:${DB_HOST:-172.20.70.14}"
    volumes:
      - "./app:/var/www/html"
      - "./data/php/php.ini:/usr/local/etc/php/php.ini"
      - "./data/logs/php:/var/log/php"
    restart: always
