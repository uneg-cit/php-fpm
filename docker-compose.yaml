services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - "./app:/var/www/html"
      - "./data/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./data/logs:/var/log/nginx"
    depends_on:
      - php
    restart: always

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    volumes:
      - "./app:/var/www/html"
      - "./data/php/php.ini:/usr/local/etc/php/php.ini"
      - "./data/logs:/var/log/php-fpm"
    restart: always
