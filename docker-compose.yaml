services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - "./app:/var/www/html"
      - "./data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./data/logs:/var/log/nginx"
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    volumes:
      - "./app:/var/www/html"
      - "./data/php/php.ini:/usr/local/etc/php/php.ini:ro"
      - "./data/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro"
      - "./data/logs:/var/log/php-fpm"
    expose:
      - "9000"
